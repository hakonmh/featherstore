<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" role="img" aria-labelledby="title desc">
  <title id="title">Feather V2 / Arrow IPC file layout of one FeatherStore partition</title>
  <desc id="desc">Partition P2 of the weather/bergen table as a Feather file, from offset 0 to end of file: padded ARROW1 magic, a schema with index, temp and rain columns, no dictionary batches, a single record batch made of a metadata header and a body where each column's buffers are stored contiguously, an end-of-stream marker, a footer holding a schema copy and the offset of the record batch, the footer length, and a closing ARROW1 magic.</desc>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; font-size: 15px; }
    .title { font-size: 22px; font-weight: 650; }
    .subtitle { font-size: 14px; fill: #52606d; }
    .bold { font-weight: 650; }
    .muted { fill: #52606d; }
    .small { font-size: 13px; }
    .center { text-anchor: middle; }
    .teal-text { fill: #1d7a70; }
    .panel { fill: #f7f8fa; stroke: #7b8794; stroke-width: 1.5; }
    .file { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.2; }
    .card { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; }
    .optional { fill: #ffffff; stroke: #9aa5b1; stroke-width: 1.5; stroke-dasharray: 8 5; }
    .magic { fill: #e4e7eb; stroke: #9aa5b1; stroke-width: 1.2; }
    .cell { stroke: #3e4c59; stroke-width: 1; }
    .bitmap { fill: #ffffff; stroke: #7b8794; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .index { fill: #d9b8ff; }
    .temp { fill: #9ecbff; }
    .rain { fill: #b6e3b8; }
    .lookup { stroke: #2c9c8f; stroke-width: 2; fill: none; marker-end: url(#teal-head); }
  </style>
  <defs>
    <marker id="teal-head" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2c9c8f"/>
    </marker>
    <g id="column-buffers">
      <rect class="bitmap" x="226" y="0" width="54" height="34" rx="3"/>
      <text class="small center" x="253" y="22">nulls</text>
      <rect class="cell" x="288" y="0" width="58" height="34" rx="3"/>
      <rect class="cell" x="352" y="0" width="58" height="34" rx="3"/>
      <rect class="cell" x="416" y="0" width="58" height="34" rx="3"/>
      <rect class="cell" x="480" y="0" width="58" height="34" rx="3"/>
      <text class="center" x="576" y="23">&#8230;</text>
      <rect class="cell" x="608" y="0" width="58" height="34" rx="3"/>
    </g>
  </defs>

  <text class="title" x="40" y="36">One partition: weather/bergen/00000002000000.feather</text>
  <text class="subtitle" x="40" y="58">Partition P2 (Feb 01 &#8211; Feb 29) as an Arrow IPC file, read from offset 0 (top) to end of file (bottom)</text>

  <text class="muted" x="40" y="104">Offset 0</text>
  <text class="muted" x="40" y="672">End</text>
  <text class="muted" x="40" y="692">of file</text>

  <rect class="panel" x="120" y="78" width="640" height="624" rx="6"/>

  <rect class="magic" x="140" y="96" width="600" height="36" rx="4"/>
  <text class="center" x="440" y="119">ARROW1 magic + padding</text>

  <rect class="file" x="140" y="146" width="600" height="44" rx="4"/>
  <text class="center" x="440" y="173"><tspan class="bold">Schema</tspan>  index: date32, temp: double, rain: double</text>

  <rect class="optional" x="140" y="204" width="600" height="44" rx="4"/>
  <text class="center muted" x="440" y="231">Optional dictionary batches (none: no categorical columns)</text>

  <g transform="translate(0, 262)">
    <rect class="card" x="140" y="0" width="600" height="218" rx="6"/>
    <rect class="magic" x="160" y="12" width="560" height="30" rx="4"/>
    <text class="small center" x="440" y="32">Metadata: 29 rows, buffer offsets + sizes</text>

    <text class="bold" x="160" y="77">index</text>
    <use href="#column-buffers" class="index" y="54"/>
    <text class="small center" x="317" y="76">19754</text>
    <text class="small center" x="381" y="76">19755</text>
    <text class="small center" x="445" y="76">19756</text>
    <text class="small center" x="509" y="76">19757</text>
    <text class="small center" x="637" y="76">19782</text>

    <text class="bold" x="160" y="121">temp</text>
    <use href="#column-buffers" class="temp" y="98"/>
    <text class="small center" x="317" y="120">2.1</text>
    <text class="small center" x="381" y="120">1.4</text>
    <text class="small center" x="445" y="120">0.8</text>
    <text class="small center" x="509" y="120">-0.3</text>
    <text class="small center" x="637" y="120">3.2</text>

    <text class="bold" x="160" y="165">rain</text>
    <use href="#column-buffers" class="rain" y="142"/>
    <text class="small center" x="317" y="164">4.2</text>
    <text class="small center" x="381" y="164">0.0</text>
    <text class="small center" x="445" y="164">0.0</text>
    <text class="small center" x="509" y="164">1.1</text>
    <text class="small center" x="637" y="164">0.2</text>

    <text class="center" x="440" y="204"><tspan class="bold">Record batch</tspan>  body: one contiguous buffer per column</text>
  </g>

  <rect class="file" x="140" y="494" width="600" height="32" rx="4"/>
  <text class="center" x="440" y="515">End-of-stream marker</text>

  <rect class="file" x="140" y="540" width="600" height="94" rx="4"/>
  <rect class="magic" x="160" y="556" width="200" height="62" rx="4"/>
  <text class="center" x="260" y="592">Schema copy</text>
  <text class="bold center" x="550" y="580">Footer</text>
  <text class="small center muted" x="550" y="604">offset + size of the record batch</text>

  <rect class="magic" x="140" y="648" width="600" height="36" rx="4"/>
  <text class="center" x="440" y="671">Footer length (int32) + ARROW1 magic</text>

  <path class="lookup" d="M742,587 C900,587 900,371 744,371"/>
  <text class="teal-text" x="790" y="470">seek straight</text>
  <text class="teal-text" x="790" y="490">to the batch</text>

  <text class="muted center" x="440" y="734">Index values are date32 day counts: 19754 = 2024-02-01, 19782 = 2024-02-29.</text>
  <text class="muted center" x="440" y="756">A memory-mapped reader of cols=["temp"] touches only the index and temp buffers.</text>
</svg>
