version: '3'

includes:
  bench: .tasks/bench.yml
  docs: .tasks/docs.yml
  lint: .tasks/lint.yml
  test: .tasks/tests.yml

tasks:
  uv-sync: uv sync --all-groups --all-extras
  pre-commit:
    desc: Run the same checks as GitHub Actions (tests, lint fix, docs lint)
    cmds:
      - task: test:all
      - task: lint:fix
      - task: docs:lint