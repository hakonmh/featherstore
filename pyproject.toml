[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "FeatherStore"
dynamic = ["version"]
description = "High performance datastore built upon Apache Arrow & Feather"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Håkon Magne Holmen", email = "haakonholmen@hotmail.com"},
]
requires-python = ">=3.11"
keywords = ["feather", "arrow", "pandas", "polars", "datastore"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pandas>=2.2.0",
    "polars[timezone]>=1.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
dev = [
    "numpy>=1.26.0",
    "pytest>=7.0.0",
    "flake8>=5.0.4",
    "Flake8-pyproject",
    "sphinx",
    "pydata-sphinx-theme",
    "bmark-py>=0.0.4",
    "duckdb",
]

[project.urls]
Homepage = "https://github.com/Hakonmh/featherstore"
Documentation = "https://featherstore.readthedocs.io/en/stable/"

[tool.setuptools.dynamic]
version = {attr = "featherstore.__version__"}

[tool.setuptools.packages.find]
exclude = ["tests*", "docs*", "benchmarks*", ".dev*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-s --tb=short -m 'not integration and not e2e'"
testpaths = ["tests"]
markers = [
    "integration: platform-specific integration tests",
    "e2e: end-to-end tests",
]

[tool.flake8]
exclude = [".dev", "benchmarks", "build", "dist"]
ignore = ["F405", "F403", "E203"]
max-line-length = 100
count = true
per-file-ignores = [
    "tests/fixtures/__init__.py:F401",
]
