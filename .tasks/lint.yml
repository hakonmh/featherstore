version: '3'

tasks:
  check:
    desc: Run ruff lint and format checks
    cmds:
      - task: check-lint
      - task: check-format
  fix:
    desc: Run ruff lint and format fixes
    cmds:
      - task: lint
      - task: format
  check-lint:
    desc: Lint Python sources with ruff
    cmds:
      - cmd /c uv run ruff check featherstore tests
    silent: false
  check-format:
    desc: Check Python formatting with ruff
    cmds:
      - cmd /c uv run ruff format --check featherstore tests
    silent: false
  lint:
    desc: Lint Python sources with ruff
    cmds:
      - cmd /c uv run ruff check --fix featherstore tests
    silent: false
  format:
    desc: Format Python sources with ruff
    cmds:
      - cmd /c uv run ruff format featherstore tests
    silent: false
