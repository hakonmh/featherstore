# Required
version: 2

# Set the version of Python and other tools you might need
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# Build documentation in the docs/ directory with Sphinx
sphinx:
   configuration: docs/conf.py

# Install the project and the dev extra (docs tools live there)
python:
   install:
   - method: pip
     path: .
     extra_requirements:
       - dev
