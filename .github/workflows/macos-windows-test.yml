# This workflow will install Python dependencies and run tests on recent
# Python versions with the newest allowed dependencies on MacOS and Windows.

name: MacOS and Windows Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        exclude:
          - os: windows-latest
            python-version: '3.13'

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
    - name: Install dependencies
      run: uv sync --all-extras --dev
    - name: Test with pytest
      run: uv run pytest
