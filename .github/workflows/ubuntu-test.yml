# This workflow will install Python dependencies, run tests and lint on Python 3.11
# with the minimum versions of the dependencies on Ubuntu.
# Mirrors: task test:all, task lint:fix, task docs:lint

name: Ubuntu Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: "3.11"
        enable-cache: true
        activate-environment: true
        no-project: true
    - name: Install dependencies
      run: |
        uv pip install pytest ruff numpy doc8 pyarrow==14.0.0 pandas==2.2.0 'polars[timezone]==1.21.0'
        uv pip install -e .
    - name: Test with pytest
      run: bash .scripts/tests/run_all_tests.sh
    - name: Lint with ruff
      run: |
        uv run ruff check --fix featherstore tests
        uv run ruff format featherstore tests
    - name: Lint docs
      working-directory: docs
      run: uv run doc8 --ignore-path _build/html --ignore D000,D004,D005 --max-line-length 120
